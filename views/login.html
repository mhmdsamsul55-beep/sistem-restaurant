<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SamzzResto</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(rgba(0, 0, 0, .55),
                    rgba(0, 0, 0, .55)),
                url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80");

            background-size: cover;
            background-position: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .2);
        }

        .logo {
            text-align: center;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .logo span {
            color: #e67e22;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 6px;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #e67e22;
        }

        .error {
            color: red;

            font-size: 12px;

            margin-top: 5px;
        }

        .login-button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #e67e22;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .login-button:hover {
            background: #cf711f;
        }

        .divider {
            display: flex;

            align-items: center;

            gap: 10px;

            margin: 22px 0;

            color: #999;

            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;
        }

        .google-button {
            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 6px;

            background: white;

            color: #333;

            font-weight: bold;

            cursor: pointer;
        }

        .google-button:hover {
            background: #f5f5f5;
        }

        .register-text {
            text-align: center;

            margin-top: 25px;

            font-size: 13px;

            color: #777;
        }

        .register-text a {
            color: #e67e22;

            font-weight: bold;

            text-decoration: none;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #777;

            font-size: 12px;

            text-decoration: none;
        }

        /* =========================
           SOCIAL MEDIA
        ========================= */

        .social-section {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #eee;

            text-align: center;
        }

        .social-title {
            font-size: 12px;

            color: #999;

            margin-bottom: 12px;
        }

        .social-links {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;
        }

        .social-links a {
            width: 38px;

            height: 38px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #f5f5f5;

            color: #333;

            text-decoration: none;

            font-size: 17px;

            transition: .2s;
        }

        .social-links a:hover {
            background: #393735;

            color: white;

            transform: translateY(-3px);
        }

        .copyright {
            margin-top: 12px;

            font-size: 10px;

            color: #aaa;
        }

        @media(max-width:500px) {

            .login-box {
                padding: 28px 22px;
            }

            .social-links a {
                width: 36px;

                height: 36px;

                font-size: 16px;
            }
        }
    </style>

</head>


<body>

    <div class="login-box">

        <div class="logo">
            Sammzzz<span>Resto</span>
        </div>

        <p class="subtitle">
            Masuk ke akun kamu
        </p>


        <!-- FORM LOGIN -->

        <form action="/login" method="POST" id="loginForm">

            <!-- EMAIL / NOMOR HP -->

            <div class="form-group">

                <label for="login">
                    Email atau Nomor HP
                </label>

                <input type="text" id="login" name="login" placeholder="Masukkan email atau nomor HP"
                    autocomplete="username">

                {{if .logError}}

                <div class="error">
                    {{.logError}}
                </div>

                {{end}}

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="Masukkan password"
                    autocomplete="current-password">

                {{if .passError}}

                <div class="error">
                    {{.passError}}
                </div>

                {{end}}

            </div>


            <button type="submit" class="login-button">

                Login

            </button>

        </form>


        <div class="divider">
            atau
        </div>


        <!-- GOOGLE -->

        <button type="button" class="google-button" onclick="window.location.href='/loginauth'">

            <i class="fa-brands fa-google"></i>
            Login dengan Google

        </button>


        <!-- REGISTER -->

        <p class="register-text">

            Belum punya akun?

            <a href="/register">
                Register
            </a>

        </p>


        <!-- KEMBALI -->

        <a href="/" class="back">
            Kembali ke halaman utama
        </a>


        <!-- =========================
             SOCIAL MEDIA
        ========================== -->

        <div class="social-section">

            <div class="social-title">
                Ikuti dan hubungi kami
            </div>


            <div class="social-links">

                <!-- GitHub -->

                <a href="https://github.com/mhmdsamsul55-beep" target="_blank" rel="noopener noreferrer" title="GitHub">

                    <i class="fa-brands fa-github"></i>

                </a>


                <!-- Instagram -->

                <a href="https://www.instagram.com/sammzzzgo" target="_blank" rel="noopener noreferrer"
                    title="Instagram">

                    <i class="fa-brands fa-instagram"></i>

                </a>


                <!-- Email -->

                <a href="mailto:mhmdsamsul55@gmail.com" title="Email">

                    <i class="fa-solid fa-envelope"></i>

                </a>

            </div>


            <div class="copyright">
                © 2026 SammzzzGO
            </div>

        </div>

    </div>


    <script>

        function loginGoogle() {

            alert(
                "Login Google akan diproses oleh backend Go."
            );

        }

    </script>

</body>

</html>
